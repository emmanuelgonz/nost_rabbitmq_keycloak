networks:
  rabbitmq_net:
    name: rabbitmq_net
    driver: bridge
services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: "nginx-proxy"
    networks:
      - rabbitmq_net
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./certs:/etc/nginx/certs"
      - "./vhost:/etc/nginx/vhost.d"
      - "./html:/usr/share/nginx/html"
      - "/var/run/docker.sock:/tmp/docker.sock:ro"
    environment:
      - DEFAULT_HOST=nost.smce.nasa.gov
  nginx-proxy-acme:
    image: nginxproxy/acme-companion
    container_name: "acme-companion"
    networks:
      - rabbitmq_net
    restart: always
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./acme:/etc/acme.sh"
      - "./certs:/etc/nginx/certs:rw"
    environment:
      - DEFAULT_EMAIL=emmanuelgonzalez@asu.edu
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - FILES_PERMS=644
      - DEBUG=1
  # MIGRATION (keycloak_migration): the self-hosted Keycloak service was removed.
  # Authentication now uses the NASA Science Cloud Keycloak at
  # https://auth.sciencecloud.nasa.gov/realms/NOS-T (see conf/keycloak/rabbitmq.conf).
  # The `.env` KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD vars and the
  # conf/keycloak/import/ realm export are no longer consumed by this stack.
  rabbitmq:
    image: rabbitmq:4.0.8-management
    container_name: "rabbitmq"
    networks:
      - rabbitmq_net
    restart: always
    ports:
      - "15672:15672"
      - "5672:5672"
      - "5552:5552"
      - "15671:15671"
      - "5671:5671"
    volumes:
      - ./conf/keycloak:/conf
      - ./conf/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./conf/keycloak/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./conf/keycloak/advanced.config:/etc/rabbitmq/advanced.config:ro
      - ./certs:/certs
    environment:
      # MIGRATION (keycloak_migration): 8443 was the self-hosted Keycloak port,
      # now removed. RabbitMQ does not serve 8443; leaving this stale routed the
      # public vhost at a dead port. Commented out pending nginx-proxy review.
      # - VIRTUAL_PORT=8443
      - VIRTUAL_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_TEST=true
  rabbitmq_tcp_relay:
    image: cloudamqp/websocket-tcp-relay
    container_name: "rabbitmq_tcp_relay"
    networks:
      - rabbitmq_net
    restart: always
    ports:
      - "15670:15670"
    volumes:
      - ./conf/keycloak:/conf
      - ./certs:/certs
    environment:
      # MIGRATION (keycloak_migration): 8443 was the self-hosted Keycloak port,
      # now removed. The relay serves 15670, not 8443. Commented out pending
      # nginx-proxy review.
      # - VIRTUAL_PORT=8443
      - VIRTUAL_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_TEST=true
    command: --upstream=tcp://rabbitmq:5672 --bind=0.0.0.0 --tls-cert=/certs/nost.smce.nasa.gov/fullchain.pem --tls-key=/certs/nost.smce.nasa.gov/key.pem
  nost-sos:
    image: emmanuelgonzalez/nost_sos_visualization:latest
    container_name: "nost-sos"
    networks:
      - rabbitmq_net
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ".env:/usr/src/app/.env"
    environment:
      - VIRTUAL_PORT=3000
      - VIRTUAL_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_TEST=true
  nost-monitor-frontend:
    build:
      context: ../nost-monitor-frontend/
    container_name: "nost-monitor-frontend"
    networks:
      - rabbitmq_net
    restart: always
    expose:
      - "80"
    environment:
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_TEST=true
  nost-monitor-backend:
    build:
      context: ../nost-monitor-backend/
    container_name: "nost-monitor-backend"
    networks:
      - rabbitmq_net
    restart: always
    stop_grace_period: 15s
    env_file:
      - ../nost-monitor-backend/.env
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=nost.smce.nasa.gov
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=nost.smce.nasa.gov
      - LETSENCRYPT_TEST=true